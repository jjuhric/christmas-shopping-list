name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-${{ github.ref_name }}"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      - name: Run Unit, Integration & Regression Tests
        run: npm run test

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          VITE_USE_FIREBASE_EMULATOR: 'true'
          VITE_MASTER_ADMIN_EMAIL: 'admin@example.com'

      - name: Build
        run: npm run build

      # main -> production, published at the site root:
      #   https://jjuhric.github.io/christmas-shopping-list/
      - name: Deploy production (main) to Pages root
        if: github.ref_name == 'main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .
          keep_files: true
          commit_message: "deploy: production from ${{ github.sha }}"

      # develop -> development, published at a /dev/ subpath so it never
      # overwrites production:
      #   https://jjuhric.github.io/christmas-shopping-list/dev/
      - name: Deploy development (develop) to /dev subpath
        if: github.ref_name == 'develop'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: dev
          keep_files: true
          commit_message: "deploy: development from ${{ github.sha }}"
